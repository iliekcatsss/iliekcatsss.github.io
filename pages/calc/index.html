<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
</head>
<body>
    <div id="navbar"></div>
    <script src="/js/navbar.js"></script>
    <div class="content">
        <div class="card calc">
            <a href="../index.html" class="link">Volver</a>
            <h1>Calculadora</h1>
            <input type="text" id="display" placeholder="0" readonly style="margin-bottom: 12px; text-align: right; font-size: 2rem;">
            
            <div class="grid-botones">
                <button class="btn-clear" onclick="borrar()">C</button>
                <button class="btn-operador" onclick="presionar('/')">÷</button>
                <button class="btn-operador" onclick="presionar('*')">×</button>
                <button class="btn-operador" onclick="presionar('-')">-</button>
                
                <button onclick="presionar('7')">7</button>
                <button onclick="presionar('8')">8</button>
                <button onclick="presionar('9')">9</button>
                <button class="btn-operador" onclick="presionar('+')">+</button>
                
                <button onclick="presionar('4')">4</button>
                <button onclick="presionar('5')">5</button>
                <button onclick="presionar('6')">6</button>
                <button onclick="presionar('.')">.</button>
                
                <button onclick="presionar('1')">1</button>
                <button onclick="presionar('2')">2</button>
                <button onclick="presionar('3')">3</button>
                <button onclick="presionar('0')">0</button>
                
                <button class="btn-igual" onclick="calcular()" style="grid-column: span 4;">=</button>
            </div>
        </div>
        <script src="/js/calc.js"></script>
    </div>
    </body>
</html>
