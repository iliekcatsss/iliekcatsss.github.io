<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de caracteres</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="icon" type="image/x-icon" href="../images/favicon.ico">
</head>
<body>
    <div id="navbar"></div>
    <script src="../js/navbar.js"></script>
    <div class="content">
        <div class="card">
            <a href="../index.html" class="link">Volver</a>
            <h1>Contador de caracteres</h1>

            <textarea id="counter" maxlength="1666666" placeholder="Escribe"></textarea>
            
            <div class="grid">
                <p>Letras</p>
                <p id="r-letters">0</p>
                <p>Números</p>
                <p id="r-numbers">0</p>
                <p>Símbolos</p>
                <p id="r-symbols">0</p>
                <p>Espacios</p>
                <p id="r-spaces">0</p>
                <p>Total</p>
                <p id="r-all">0</p>
            </div>
        </div>
    </div>

    <script src="../js/charcounter.js"></script>
</body>
</html>
